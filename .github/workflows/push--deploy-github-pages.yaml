name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/push--deploy-github-pages.yaml"
      - "docs/**/*"
      - "flake.lock"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Create final site directory
        run: mkdir ./_site
      - name: Install Nix
        uses: cachix/install-nix-action@v31.7.0
      - name: Compile report using Nix
        run: nix build --print-build-logs .#report
      - name: Copy report into site directory
        run: cp ./result/share/report.pdf ./_site/report.pdf
      - name: Create main site
        run: |
          export file="$(mktemp)"; {
          echo '<!DOCTYPE html>                                        '
          echo '<html lang="en">                                       '
          echo '  <head>                                               '
          echo '    <meta charset="UTF-8">                             '
          echo '    <meta name="viewport"                              '
          echo '      content="width=device-width, initial-scale=1.0"> '
          echo '    <meta http-equiv="refresh"                         '
          echo '    content="0; url=./report.pdf">                     '
          echo '    <title>Report 2IMF25</title>                       '
          echo '  </head>                                              '
          echo '  <body>                                               '
          echo '    <p>                                                '
          echo '      If you are not automatically redirected          '
          echo '      <a href="./report.pdf">click here</a>.           '
          echo '    </p>                                               '
          echo '  </body>                                              '
          echo '</html>                                                '
          } > ./_site/index.html
          cp ./_site/index.html ./_site/404.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with: { path: ./_site }

  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
